name: bodies-sync

# Keep the supported-bodies table in the READMEs in sync with
# body_profiles/ — refreshes the auto-generated block on any push that
# touches bodies, the generator, or the READMEs.

on:
  push:
    branches: [main]
    paths:
      - 'body_profiles/**'
      - 'scripts/gen_body_list.py'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/bodies-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: regenerate body list
        run: python scripts/gen_body_list.py

      - name: commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md README.zh-CN.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md README.zh-CN.md
            git commit -m "chore: auto-update supported-bodies list [skip ci]"
            git push
          else
            echo "READMEs already in sync"
          fi
