<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>see-through-camera</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#14181d;color:#e8e6e1;font:15px/1.6 -apple-system,"Helvetica Neue",Arial,sans-serif}
  main{max-width:640px;padding:48px 24px;text-align:center}
  h1{font-size:22px;font-weight:600;letter-spacing:.02em;margin:0 0 8px}
  p{color:#9aa3ad;margin:0 0 28px}
  img{max-width:100%;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .portrait{max-height:70vh;width:auto}
</style>
</head>
<body>
<main>
  <h1>see-through-camera</h1>
  <p>Put your photo back into the camera's rear LCD.<br>In-browser generator is in progress — here is what it makes:</p>
  <img src="sample-card.jpg" alt="sample card" style="margin-bottom:20px">
  <br>
  <img class="portrait" src="sample-card-portrait.jpg" alt="portrait sample card">
</main>
</body>
</html>
